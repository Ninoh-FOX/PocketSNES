name: Actualizar Submódulo Core

on:
  workflow_dispatch: # Crea el botón manual en la pestaña Actions

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para poder guardar el cambio en el repo
    steps:
      - name: Descargar repositorio y submódulo
        uses: actions/checkout@v4
        with:
          ref: koriki
          submodules: recursive

      - name: Actualizar submódulo core al último commit
        run: |
          git submodule update --remote core
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core
          git commit -m "Update core submodule to latest commit" || exit 0
          git push origin koriki
