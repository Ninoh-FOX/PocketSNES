name: Actualizar Submódulo Core

on:
  workflow_dispatch:

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          ref: koriki
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar submódulo a último commit de koriki
        run: |
          git config --global url."https://github.com".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule foreach 'git fetch origin koriki && git checkout -B koriki origin/koriki'
          git status
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update core submodule to latest koriki commit"
            git push origin koriki
          else
            echo "El submódulo ya estaba actualizado al último commit."
          fi
